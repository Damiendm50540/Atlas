server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # envoi de vidéos volumineuses, transmis directement au backend sans tampon disque
    client_max_body_size 4g;

    location / {
        try_files $uri /index.html;
    }

    # API + flux vidéo MJPEG (long, sans tampon pour rester en temps réel)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # photos des détections
    location /captures/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
