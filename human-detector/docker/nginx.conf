server {
    listen 80;
    server_name _;
    server_tokens off;

    # vidéos : même plafond que APP_MAX_UPLOAD_MB (500 Mo par défaut)
    client_max_body_size 600m;

    # Tout passe par le backend (authentification incluse) : page, captures, photos, API, flux MJPEG.
    # Pour activer HTTPS, terminer TLS ici (listen 443 ssl) ou devant ce conteneur ;
    # X-Forwarded-Proto active alors cookie Secure + HSTS côté backend.
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr écrase tout X-Forwarded-For fourni par le client (anti-usurpation)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
