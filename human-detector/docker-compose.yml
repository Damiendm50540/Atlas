name: argus

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TORCH_HOME: /app/models/torch  # poids facenet : seul le volume models est inscriptible
    # notifications (ntfy / email) : variables du fichier .env, facultatif
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/app/data        # historique (base SQLite) + photos
      - uploads:/app/uploads  # vidéos envoyées
      - models:/app/models    # modèle MediaPipe (téléchargé au premier lancement)
    # pas de port publié : seul le frontend parle au backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
  uploads:
  models:
